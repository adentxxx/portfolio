name: Export static site

# GitHub Pages is unavailable on the free plan while this repository is private.
# The public test site is the separate repository adentxxx/adentxxx.github.io.
on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Seed demo database
        run: |
          printf '%s\n' 'DATABASE_URL="file:./dev.db"' > .env
          npx prisma migrate deploy
          npx prisma db seed

      - name: Export static site
        env:
          GITHUB_PAGES: "true"
          DATABASE_URL: file:./dev.db
        run: |
          npm run build:pages
          node -e "require('fs').writeFileSync('out/.nojekyll','')"

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
